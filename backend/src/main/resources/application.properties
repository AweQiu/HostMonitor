server.port=8080
spring.application.name=HostMonitor

socket.port=12345

screen.udp.port=12346

spring.datasource.url=jdbc:mysql://localhost:3306/host_monitor?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
