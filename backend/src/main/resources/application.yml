server:
  port: 10800

spring:
  application:
    name: HostMonitor
  datasource:
    url: 'jdbc:mysql://localhost:3306/host_monitor?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true'
    username: '${DB_USERNAME}'
    password: '${DB_PASSWORD}'
    driver-class-name: com.mysql.cj.jdbc.Driver

socket:
  port: 10801

screen:
  udp:
    port: 10802

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDel
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
